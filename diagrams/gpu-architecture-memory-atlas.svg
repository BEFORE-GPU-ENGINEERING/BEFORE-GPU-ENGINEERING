<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1640" font-family="'Comic Neue','Patrick Hand','Comic Sans MS',sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- paper background -->
  <rect width="1280" height="1640" fill="#faf6ec"/>
  <rect width="1280" height="1640" fill="none" stroke="#e8e0cc" stroke-width="3"/>

  <!-- ===================== TITLE ===================== -->
  <text x="640" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a1a">The Whole Machine</text>
  <text x="640" y="108" text-anchor="middle" font-size="24" fill="#555">GPU Architecture &amp; Memory Hierarchy Atlas</text>
  <line x1="300" y1="126" x2="980" y2="126" stroke="#eab308" stroke-width="4"/>

  <!-- small handwritten note -->
  <text x="640" y="152" text-anchor="middle" font-size="16" fill="#777" font-style="italic">one picture that ties together every chapter of this notebook</text>

  <!-- ===================== SECTION A: EXECUTION MODEL ===================== -->
  <rect x="40" y="190" width="560" height="820" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="62" y="228" font-size="22" font-weight="700" fill="#1a1a1a">① The Execution Model</text>

  <!-- Host CPU -->
  <rect x="150" y="252" width="340" height="64" rx="12" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">HOST CPU</text>
  <text x="320" y="300" text-anchor="middle" font-size="14" fill="#555">serial, general-purpose</text>

  <!-- PCIe arrow -->
  <line x1="320" y1="316" x2="320" y2="352" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="342" font-size="14" fill="#71717a">PCIe bus (slow, GB/s)</text>

  <!-- GPU chip -->
  <rect x="90" y="356" width="460" height="632" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
  <text x="320" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">GPU CHIP</text>
  <text x="320" y="408" text-anchor="middle" font-size="14" fill="#555">~ 100+ SMs, thousands of cores</text>

  <!-- GPC wrapper -->
  <rect x="120" y="424" width="400" height="540" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="320" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">GPC (Graphics Processing Cluster)</text>

  <!-- three SM boxes -->
  <g>
    <rect x="150" y="470" width="340" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
    <text x="320" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">SM — Streaming Multiprocessor</text>
    <text x="320" y="516" text-anchor="middle" font-size="13" fill="#555">each SM = a tiny independent computer</text>
    <line x1="170" y1="528" x2="470" y2="528" stroke="#e2e8f0"/>
    <text x="320" y="550" text-anchor="middle" font-size="13" fill="#1a1a1a">Warp Scheduler(s)</text>
    <text x="320" y="574" text-anchor="middle" font-size="13" fill="#1a1a1a">32-lane SIMT core (FP32/INT32)</text>
    <text x="320" y="596" text-anchor="middle" font-size="13" fill="#1a1a1a">Tensor cores (AI/GEMM)</text>
    <text x="320" y="612" text-anchor="middle" font-size="12" fill="#b45309">+ on-chip Shared Memory &amp; Register File</text>
  </g>

  <rect x="150" y="640" width="340" height="120" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="672" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">SM</text>
  <text x="320" y="698" text-anchor="middle" font-size="13" fill="#555">… and another ~100 of these</text>
  <text x="320" y="724" text-anchor="middle" font-size="13" fill="#555">… each running many warps at once</text>
  <text x="320" y="746" text-anchor="middle" font-size="13" fill="#b45309">(that's the parallelism)</text>

  <rect x="150" y="780" width="340" height="120" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="812" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">SM</text>
  <text x="320" y="838" text-anchor="middle" font-size="13" fill="#555">… and more</text>
  <text x="320" y="862" text-anchor="middle" font-size="13" fill="#555">all in parallel across the chip</text>

  <!-- warp callout -->
  <rect x="130" y="920" width="380" height="34" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="320" y="943" text-anchor="middle" font-size="14" fill="#854d0e" font-weight="700">A WARP = 32 threads that execute as one (SIMT)</text>

  <!-- ===================== SECTION B: MEMORY HIERARCHY ===================== -->
  <rect x="660" y="190" width="580" height="820" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="682" y="228" font-size="22" font-weight="700" fill="#1a1a1a">② The Memory Hierarchy</text>

  <!-- bandwidth/latency label -->
  <text x="1220" y="260" text-anchor="end" font-size="13" fill="#b45309" font-weight="700">← cheaper, bigger, slower</text>
  <text x="1220" y="278" text-anchor="end" font-size="13" fill="#b45309" font-weight="700">faster, smaller, pricier →</text>

  <!-- Level 1 Registers -->
  <rect x="700" y="296" width="500" height="92" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="3"/>
  <text x="720" y="324" font-size="16" font-weight="700" fill="#854d0e">Registers (per-thread)</text>
  <text x="720" y="348" font-size="13" fill="#555">fastest · private to one thread · ~few KB per SM</text>
  <text x="720" y="372" font-size="13" fill="#16a34a" font-weight="700">~0–2 cycle latency · unlimited bandwidth</text>

  <!-- Level 2 Shared memory -->
  <rect x="700" y="404" width="500" height="92" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="720" y="432" font-size="16" font-weight="700" fill="#14532d">Shared Memory / Scratchpad (per-block)</text>
  <text x="720" y="456" font-size="13" fill="#555">on-chip · shared by threads of one block · ~100 KB/SM</text>
  <text x="720" y="480" font-size="13" fill="#16a34a" font-weight="700">~20 cycles · very high bandwidth · scattered access is cheap here</text>

  <!-- Level 3 L2 -->
  <rect x="700" y="512" width="500" height="92" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
  <text x="720" y="540" font-size="16" font-weight="700" fill="#312e81">L2 Cache (chip-wide)</text>
  <text x="720" y="564" font-size="13" fill="#555">shared by the whole GPU · several MB</text>
  <text x="720" y="588" font-size="13" fill="#4f46e5" font-weight="700">~200 cycles · not visible to your code</text>

  <!-- Level 4 HBM -->
  <rect x="700" y="620" width="500" height="108" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="720" y="650" font-size="16" font-weight="700" fill="#7f1d1d">Global Memory (HBM/VRAM)</text>
  <text x="720" y="674" font-size="13" fill="#555">off-chip · gigabytes · THE memory you allocate with cudaMalloc</text>
  <text x="720" y="698" font-size="13" fill="#dc2626" font-weight="700">~400–800 ns (~500+ cycles) · the bottleneck</text>

  <!-- 128 byte transaction callout -->
  <rect x="700" y="748" width="500" height="64" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="720" y="772" font-size="14" fill="#c2410c" font-weight="700">⚠ Memory moves in fixed 128-byte crates.</text>
  <text x="720" y="794" font-size="13" fill="#9a3412">Grab 4 bytes and you also haul the other 124 — that's coalescing's whole game.</text>



  <!-- ===================== SECTION C: LATENCY HIDING LOOP ===================== -->
  <rect x="40" y="1040" width="1200" height="280" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <text x="62" y="1078" font-size="22" font-weight="700" fill="#1a1a1a">③ Why Slow Memory Doesn't (Always) Stall You — Latency Hiding</text>

  <g font-size="15">
    <rect x="80" y="1100" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="195" y="1130" text-anchor="middle" font-weight="700" fill="#312e81">Warp A issues a memory</text>
    <text x="195" y="1152" text-anchor="middle" font-weight="700" fill="#312e81">load (slow, ~500 cycles)</text>

    <rect x="430" y="1100" width="230" height="80" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="545" y="1130" text-anchor="middle" font-weight="700" fill="#854d0e">Scheduler switches to</text>
    <text x="545" y="1152" text-anchor="middle" font-weight="700" fill="#854d0e">Warp B while A waits</text>

    <rect x="780" y="1100" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="895" y="1130" text-anchor="middle" font-weight="700" fill="#14532d">B computes on registers /</text>
    <text x="895" y="1152" text-anchor="middle" font-weight="700" fill="#14532d">shared memory in the meantime</text>

  </g>

  <line x1="310" y1="1140" x2="430" y2="1140" stroke="#eab308" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="660" y1="1140" x2="780" y2="1140" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="1010" y1="1140" x2="1010" y2="1140"/>

  <text x="640" y="1215" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="700">While A's data is in transit, the hardware keeps OTHER warps busy.</text>
  <text x="640" y="1240" text-anchor="middle" font-size="14" fill="#555">That's why occupancy (many warps per SM) matters.</text>
  <text x="640" y="1265" text-anchor="middle" font-size="14" fill="#555">But if a warp spills to global memory too often — or scatters its reads — it stops being hidden.</text>

  <!-- ===================== SECTION D: THE TAKEAWAY STRIP ===================== -->
  <rect x="40" y="1340" width="1200" height="270" rx="16" fill="#f8fafc" stroke="#1a1a1a" stroke-width="2"/>
  <text x="62" y="1380" font-size="22" font-weight="700" fill="#1a1a1a">④ The Golden Rules (the whole notebook in 4 lines)</text>

  <rect x="70" y="1400" width="1130" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="92" cy="1423" r="10" fill="#2563eb"/>
  <text x="115" y="1429" font-size="16" fill="#1a1a1a"><tspan font-weight="700">Memory is the bottleneck, not compute.</tspan> A GPU has enormous FLOPS; feeding them is the real job.</text>

  <rect x="70" y="1456" width="1130" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="92" cy="1479" r="10" fill="#16a34a"/>
  <text x="115" y="1485" font-size="16" fill="#1a1a1a"><tspan font-weight="700">Keep accesses coalesced.</tspan> 32 threads should read 32 neighbors → one 128-byte crate, one transaction.</text>

  <rect x="70" y="1512" width="1130" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="92" cy="1535" r="10" fill="#eab308"/>
  <text x="115" y="1541" font-size="16" fill="#1a1a1a"><tspan font-weight="700">Use on-chip memory (shared memory / registers) for reuse.</tspan> Move data in once, chew on it many times.</text>

  <rect x="70" y="1568" width="1130" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="92" cy="1591" r="10" fill="#dc2626"/>
  <text x="115" y="1597" font-size="16" fill="#1a1a1a"><tspan font-weight="700">Keep occupancy high.</tspan> Many warps per SM = latency hidden, memory queues filled, hardware kept busy.</text>

  <!-- footer -->
  <text x="640" y="1630" text-anchor="middle" font-size="13" fill="#9ca3af" font-style="italic">Before GPU Engineering — community contribution · SVG diagram</text>
</svg>
